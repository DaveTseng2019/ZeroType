name: zero_type
description: "ZeroType - AI-powered voice transcription & refinement tool"
publish_to: 'none'

version: 1.0.8+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.1.0

  # Recording
  record: ^6.2.0

  # Windows sound playback (PlaySoundW via winmm.dll)
  ffi: ^2.1.0

  # Windows 預設錄音裝置查詢（IMMDeviceEnumerator）；本來就是傳遞依賴，改成直接依賴
  win32: ^5.15.0

  # Global hotkey
  hotkey_manager: ^0.2.3

  # System tray
  tray_manager: ^0.5.2

  # Launch at startup
  launch_at_startup: ^0.5.1

  # HTTP
  dio: ^5.8.0+1

  # File paths
  path_provider: ^2.1.5

  # Window management (for overlay window)
  window_manager: ^0.5.1

  # 多螢幕資訊查詢（判斷視窗是否跑出螢幕外）；本來就是 window_manager 的傳遞依賴，改成直接依賴
  screen_retriever: ^0.2.2

  # Local data persistence (non-secure, for settings)
  shared_preferences: ^2.3.5
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# notes: app_icon.ico 是手動生成的多尺寸 ico（16–256px，scratchpad 的 Pillow 腳本），
# 不再用 flutter_launcher_icons——它只會產 48px 單尺寸，縮放後模糊

flutter:
  uses-material-design: true

  assets:
    - assets/config/providers.json
    - assets/icons/
    - prompts/
